  <main>
    <section>
      <h2>Hei! Ota minuun yhteyttä tai anna palautetta kahvilasta!</h2>
      </p>Kaikki parannus ideat ja kehitykset tänne vain!
       <p
      <form class="yhteys-lomake">
        <div class="lomake-ryhma">
          <label for="nimi">Nimi:</label>
          <input type="text" id="nimi" name="nimi" placeholder="Etunimi Sukunimi" required>
        </div>

        <div class="lomake-ryhma">
          <label for="sposti">Sähköposti:</label>
          <input type="email" id="sposti" name="sposti" placeholder="esimerkki@sähköposti.fi" required>
        </div>
        <div class="lomake-ryhma">
          <label for="viesti">Viesti:</label>
          <textarea id="viesti" name="viesti" rows="5" placeholder="Kirjoita viestisi tähän..." required></textarea>
        </div>

        <button type="submit" class="laheta-nappi">Lähetä viesti</button>
      </form>
    </section>
  </main>
